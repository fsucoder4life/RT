<body>
    <table id="tasksUL">
        <tr><td>Store</td><td>Address</td><td>City</td><td>State</td><td>Zip</td><td>Store Phone</td><td>Store Manager</td><td>Primary Contact</td><td>Primary Contact Email</td><td>Primary Contact Phone</td><td>Company Bill To</td><td>Address Bill To</td><td>City Bill To</td><td>State Bill To</td><td>Zip Bill To</td><td>Bill To Email</td></tr>
    </table>

    <script>
        var stores2 = [];
        $().SPServices({
            async: false,
            operation: "GetListItems",
            listName: "Combined Schedule",
            CAMLViewFields: "<ViewFields><FieldRef Name='Title' /><FieldRef Name='Address_x0020_Full' /><FieldRef Name='City' /><FieldRef Name='State_x0020_' /><FieldRef Name='Zipcode' /><FieldRef Name='Store_x0020_Phone' /><FieldRef Name='POPS_x0020_Delivery_x0020_Date' /><FieldRef Name='Primary_x0020_Contact' /><FieldRef Name='Primary_x0020_Contact_x0020_Emai' /><FieldRef Name='Primary_x0020_Contact_x0020_Phon' /></ViewFields>",
            CAMLQuery: "<Query><Where><And><Leq><FieldRef Name='POPS_x0020_Delivery_x0020_Date' /><Value IncludeTimeValue='FALSE' Type='DateTime'>2024-12-31T15:56:29Z</Value></Leq><Geq><FieldRef Name='POPS_x0020_Delivery_x0020_Date'/><Value IncludeTimeValue='FALSE' Type='DateTime'><Today /></Value></Geq></And></Where><OrderBy><FieldRef Name='Title' Ascending='True' /></OrderBy></Query>",
            completefunc: function (xData, Status) {
                $(xData.responseXML).SPFilterNode("z:row").each(function () {

                    var store = {};
                    var storeNum = $(this).attr("ows_Title");
                    var address = $(this).attr("ows_Address_x0020_Full");
                    var city = $(this).attr("ows_City");
                    var state = $(this).attr("ows_State_x0020_");
                    var zip = $(this).attr("ows_Zipcode");
                    var storePhone = $(this).attr("ows_Store_x0020_Phone");
                    var popsDeliveryDate = $(this).attr("ows_POPS_x0020_Delivery_x0020_Date");
                    var primaryContact = $(this).attr("ows_Primary_x0020_Contact");
                    var primaryContactEmail = $(this).attr("ows_Primary_x0020_Contact_x0020_Emai");
                    var primaryContactPhone = $(this).attr("ows_Primary_x0020_Contact_x0020_Phon");

                    //storeNum = storeNum.substring(storeNum.indexOf(";#") + ";#".length);
                    store.StoreNumber = storeNum;
                    store.Address = address;
                    store.City = city;
                    store.State = state;
                    store.Zip = zip;
                    store.storePhone = storePhone;
                    store.PopsDeliveryDate = popsDeliveryDate;
                    store.primaryContact = primaryContact;
                    store.primaryContactEmail = primaryContactEmail;
                    store.primaryContactPhone = primaryContactPhone;

                    stores2.push(store);
                });
            }
        });
