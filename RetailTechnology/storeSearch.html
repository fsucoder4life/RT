        <div id="search-container" style="display:block !important;">Search Stores:<input id='search' style="display: inline-block; margin-left: 10px; width: 385px;" name="search" type="text" title="Search" /><div id="search-type"></div></div>

    <script>
        var searchTimeoutId = null;

        function GetQueryStringParams(sParam) {
            var sPageURL = window.location.search.substring(1);
            var sURLVariables = sPageURL.split('&');
            for (var i = 0; i < sURLVariables.length; i++) {
                var sParameterName = sURLVariables[i].split('=');
                if (sParameterName[0] == sParam) {
                    return sParameterName[1];
                }
            }
        }

        if (GetQueryStringParams("search")) {
            window.location = "index.aspx#search/" + GetQueryStringParams("search");
        }

        $('#current-date').html(moment().format('dddd, MMMM Do YYYY - h:mm A'));


        //Create a change event handler to store the type in local storage and re-search
        $("#search").on('change', function () {

            //Set the hash value to initiate search and enable forward/back
            //TODO this is a hack!!! - probably need a re-route function on the router, or need to get the route check function public so I can call another search directly here
            var val = $('#search').val();
            if (val !== '') {
                //parent.window.location = "index.aspx#search/" + val;
                parent.window.location = "storeSearch.html?search=" + val;

            }
        });

        $('#search').keyup(function (evt) {
            //Ignore if blank and not on search


            //And ignore if it's the tab or shift key
            if (evt.keyCode == '9' || evt.keyCode == '16') {
                return;
            }

            //Clear timeout if exists
            if (searchTimeoutId !== null) {
                clearTimeout(searchTimeoutId);
            }

            //Set new timeout to search
            searchTimeoutId = setTimeout(function () {
                //Set the hash value to initiate search and enable forward/back
                var val = $('#search').val();
                if (val === '') {
                    //Show search box

                } else {
                    //Search for results


                    parent.window.location = "storeSearch.html?search=" + val;

                }
            }, 350);



        });

    </script>
